<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-label="PORTAL error 800 por 480" font-family="Arial, sans-serif"><defs><clipPath id="screen-clip"><rect width="800" height="480"/></clipPath></defs><g clip-path="url(#screen-clip)"><rect x="0" y="0" width="800" height="480" rx="0" fill="#050b10" stroke="none" /><rect x="12" y="10" width="776" height="48" rx="8" fill="#050b10" stroke="#284b66" /><text x="26" y="40" font-size="14" fill="#abc3df" font-weight="500" text-anchor="start" >APERTURE</text><text x="400" y="41" font-size="22" fill="#ff304d" font-weight="500" text-anchor="middle" >ERROR</text><circle cx="626" cy="34" r="4" fill="#00e676"/><text x="637" y="39" font-size="12" fill="#abc3df" font-weight="400" text-anchor="start" >KLIPPER</text><g transform="translate(725,22) scale(1.0416666666666667)"><path d="M2 7a17 17 0 0 1 20 0 M5 11a12 12 0 0 1 14 0 M8 15a7 7 0 0 1 8 0 M12 20h.01" fill="none" stroke="#00e676" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="12" y="70" width="264" height="398" rx="8" fill="#150c14" stroke="#532037" /><image href="../assets/potatOS_panel.png" x="34" y="105" width="220" height="224"/><text x="144" y="390" font-size="14" fill="#abc3df" font-weight="400" text-anchor="middle" >Klipper requiere atención</text><rect x="292" y="70" width="496" height="260" rx="8" fill="#0c151e" stroke="#284b66" /><text x="313" y="104" font-size="12" fill="#abc3df" font-weight="500" text-anchor="start" >MENSAJE DE KLIPPER</text><text x="313" y="145" font-size="20" fill="#f5f8fc" font-weight="400" text-anchor="start" >Shutdown due to webhooks request</text><text x="313" y="181" font-size="17" fill="#f5f8fc" font-weight="400" text-anchor="start" >Once the underlying issue is corrected,</text><text x="313" y="210" font-size="17" fill="#f5f8fc" font-weight="400" text-anchor="start" >use FIRMWARE_RESTART to reset the</text><text x="313" y="239" font-size="17" fill="#f5f8fc" f